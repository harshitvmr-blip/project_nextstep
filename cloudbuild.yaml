steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/next-step-guide/next-step-guide:$COMMIT_SHA'
      - '.'

  # Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/next-step-guide/next-step-guide:$COMMIT_SHA'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/next-step-guide/next-step-guide:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY